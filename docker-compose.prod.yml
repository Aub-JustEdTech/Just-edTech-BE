# Production Docker Compose — sized for EC2 t4g.large (2 vCPU, 8 GiB RAM).
#
# Steady-state only. Do NOT scale celery-*-batch or raise worker replicas on
# this host — the bulk layout needs t4g.2xlarge (8 vCPU / 32 GiB). Batch
# workers are behind Compose profile `bulk` so a plain `up -d` never starts
# them on large.
#
# Postgres is NOT managed here; it runs on AWS RDS.
# All environment variables are injected via .env.prod (CI/CD writes from secrets).
#
# Redis is split into two containers:
#   redis         — app cache (tokens/OTP/invites on db 0, pipeline status
#                   on db 3). allkeys-lru: cache is disposable, evicting a
#                   refresh-token key just forces a re-login.
#   redis-broker  — Celery broker + result backend (db 2). noeviction: an
#                   in-flight task message must NEVER be silently evicted
#                   (that broke document_pipeline chains mid-stage and
#                   orphaned documents at processing_status=PROCESSING
#                   forever during the 100-school incident). An OOM here
#                   fails loudly instead of losing data.
#                   Sized at 512mb on t4g.large: drain is 50/hr and the
#                   per-URL enqueue cap is 5, so the broker never sees the
#                   failure-batch burst that needed 4G on 2xlarge.
#
# RAM budget on t4g.large (~8 GiB):
#   api 1G + qdrant 1.5G + redis 256M + redis-broker 512M + beat 256M ≈ 3.5G
#   celery-ingest 1.5G (×1) + celery-scraper 2G (×1) = 3.5G
#   -> ~7G steady, ~1G left for the OS / page cache.
#
# Steady state (this file's default):
#   docker compose -f docker-compose.prod.yml up -d
#   # implies --scale celery-ingest=1 --scale celery-scraper=1, no batch
#
# Bulk failure-batch (REQUIRES t4g.2xlarge — do not run on large):
#   docker compose -f docker-compose.prod.yml --profile bulk up -d \
#     --scale celery-ingest=3 --scale celery-scraper=2 \
#     --scale celery-scraper-batch=2 --scale celery-ingest-batch=2
#   # and raise redis-broker --maxmemory / service memory limits first
#
# Admin scripts (seed / scrape districts) run via docker exec on the api
# container. Mount ./scripts from the EC2 checkout (git pull before ingest):
#   docker exec just-edtech-api python scripts/school_data/seed_tenant_batch.py ...

version: "3.9"

services:

  ##################################################
  # Redis — app cache (tokens, OTP, invites, pipeline status)
  # allkeys-lru is safe here: cache keys are disposable.
  ##################################################
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped

    ports:
      - "6386:6379"

    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 60s
      timeout: 5s
      retries: 5

  ##################################################
  # Redis Broker — Celery broker + result backend only.
  # noeviction: an in-flight task message must NEVER be evicted.
  # t4g.large: 512mb is enough for capped sweep (≤5 enqueue/URL) + hourly
  # drain of 50. If an OOM returns here, lower
  # SCHOOL_SCRAPER_SWEEP_MAX_SCHOOLS, not this limit.
  ##################################################
  redis-broker:
    image: redis:7-alpine
    container_name: redis-broker
    restart: unless-stopped

    ports:
      - "6387:6379"

    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy noeviction

    volumes:
      - redis_broker_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 60s
      timeout: 5s
      retries: 5

  ##################################################
  # Qdrant
  ##################################################
  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: qdrant
    restart: unless-stopped

    ports:
      - "6343:6333"
      - "6344:6334"

    volumes:
      - qdrant_data:/qdrant/storage

    # RocksDB opens many SST/log FDs under large collections (tenant-4).
    # Default soft nofile=1024 causes "Too many open files" flush failures.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1.5G

    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 30s

  ##################################################
  # FastAPI
  ##################################################
  api:
    # image: 940031346406.dkr.ecr.us-west-1.amazonaws.com/justedtech-prod-be
    image: ${ECR_IMAGE}
    pull_policy: always
    container_name: just-edtech-api
    restart: unless-stopped

    env_file:
      - .env.prod

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Celery broker/backend -> dedicated redis-broker container. App
      # cache (REDIS_HOST above) stays on `redis`.
      CELERY_BROKER_REDIS_HOST: redis-broker
      CELERY_BROKER_REDIS_PORT: 6379
      QDRANT_URL: http://qdrant:6333

    ports:
      - "8013:8000"

    depends_on:
      redis:
        condition: service_healthy
      redis-broker:
        condition: service_healthy

      qdrant:
        condition: service_healthy

    volumes:
      - temp_uploads:/app/temp_uploads
      # Batch hotfix path: git pull updates Python without waiting for ECR rebuild.
      # Same pattern as ./scripts for seed/scrape admin commands.
      - ./app:/app/app
      # Batch ingest admin scripts + JSON live on the host checkout (not in the
      # ECR image). git pull on EC2 before seed/scrape; rw so --output JSON
      # can be written under scripts/school_data/output/.
      - ./scripts:/app/scripts

    command: >
      sh -c "
      alembic upgrade head &&
      gunicorn app.main:app --config gunicorn.conf.py
      "

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8000/health"
        ]
      interval: 60s
      timeout: 10s
      retries: 5
      # alembic upgrade runs in the same process before gunicorn; allow time
      # for migrations + worker lifespan before counting failures.
      start_period: 120s

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G

  ##################################################
  # Celery Ingest Worker — document pipeline + billing
  # Queues: celery (billing/batch poll), documents (chunk/embed/Qdrant)
  # t4g.large: keep replicas=1, concurrency=1. Do not --scale above 1.
  ##################################################
  celery-ingest:
    image: ${ECR_IMAGE}
    pull_policy: always
    restart: unless-stopped

    env_file:
      - .env.prod

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_REDIS_HOST: redis-broker
      CELERY_BROKER_REDIS_PORT: 6379
      QDRANT_URL: http://qdrant:6333

    depends_on:
      redis:
        condition: service_healthy
      redis-broker:
        condition: service_healthy

      qdrant:
        condition: service_healthy

    volumes:
      - temp_uploads:/app/temp_uploads
      - ./app:/app/app

    command: >
      celery
      -A app.celery_app
      worker
      --loglevel=info
      --concurrency=1
      --max-tasks-per-child=500
      --time-limit=3600
      --soft-time-limit=3000
      -Q celery,documents

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1.5G

  ##################################################
  # Celery Scraper Worker — download, transcribe, enqueue pipeline
  # Queue: scraping. On t4g.large keep replicas=1 (do not scale).
  ##################################################

  celery-scraper:
    image: ${ECR_IMAGE}
    pull_policy: always

    restart: unless-stopped

    env_file:
      - .env.prod

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_REDIS_HOST: redis-broker
      CELERY_BROKER_REDIS_PORT: 6379
      QDRANT_URL: http://qdrant:6333

    depends_on:
      redis:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
      qdrant:
        condition: service_started

    volumes:
      - temp_uploads:/app/temp_uploads
      - ./app:/app/app

    command: >
      celery
      -A app.celery_app
      worker
      --loglevel=info
      --concurrency=1
      --max-tasks-per-child=100
      --time-limit=7200
      --soft-time-limit=6000
      -Q scraping

    healthcheck:
      test: ["CMD", "celery", "-A", "app.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 2G

  ##################################################
  # Celery Scraper Batch Worker — EXTRA scrape lane for bulk runs.
  # Profile `bulk` only — never starts on a plain `up -d` (t4g.large).
  # Requires t4g.2xlarge + raised redis-broker memory. See header.
  ##################################################
  celery-scraper-batch:
    profiles: ["bulk"]
    image: ${ECR_IMAGE}
    pull_policy: always
    restart: unless-stopped

    env_file:
      - .env.prod

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_REDIS_HOST: redis-broker
      CELERY_BROKER_REDIS_PORT: 6379
      QDRANT_URL: http://qdrant:6333

    depends_on:
      redis:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
      qdrant:
        condition: service_started

    volumes:
      - temp_uploads:/app/temp_uploads
      - ./app:/app/app
      - ./scripts:/app/scripts

    command: >
      celery
      -A app.celery_app
      worker
      --loglevel=info
      --concurrency=1
      --max-tasks-per-child=100
      --time-limit=7200
      --soft-time-limit=6000
      -Q scraping
      -n scraper-batch@%h

    healthcheck:
      test: ["CMD", "celery", "-A", "app.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G

  ##################################################
  # Celery Ingest Batch Worker — EXTRA document-pipeline lane for bulk.
  # Profile `bulk` only — never starts on a plain `up -d` (t4g.large).
  ##################################################
  celery-ingest-batch:
    profiles: ["bulk"]
    image: ${ECR_IMAGE}
    pull_policy: always
    restart: unless-stopped

    env_file:
      - .env.prod

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_REDIS_HOST: redis-broker
      CELERY_BROKER_REDIS_PORT: 6379
      QDRANT_URL: http://qdrant:6333

    depends_on:
      redis:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
      qdrant:
        condition: service_healthy

    volumes:
      - temp_uploads:/app/temp_uploads
      - ./app:/app/app

    command: >
      celery
      -A app.celery_app
      worker
      --loglevel=info
      --concurrency=1
      --max-tasks-per-child=500
      --time-limit=3600
      --soft-time-limit=3000
      -Q celery,documents
      -n ingest-batch@%h

    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  ##################################################
  # Celery Beat - Periodic Task Scheduler
  # Daily sweep + hourly drain_discovered_media (50/hr).
  # Keep replicas=1 to avoid duplicate periodic task firing.
  ##################################################

  celery-beat:
    image: ${ECR_IMAGE}
    pull_policy: always

    container_name: celery-beat
    restart: unless-stopped

    env_file:
      - .env.prod

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_REDIS_HOST: redis-broker
      CELERY_BROKER_REDIS_PORT: 6379
      QDRANT_URL: http://qdrant:6333

    volumes:
      # Batch hotfix path: git pull updates the beat_schedule without
      # waiting for an ECR rebuild -- same pattern as celery-ingest/
      # celery-scraper/api. Before this, changing app/celery_app.py needed
      # a full image rebuild+redeploy since beat had no live-code mount.
      - ./app:/app/app

    depends_on:
      redis:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
      qdrant:
        condition: service_started

    command: >
      celery
      -A app.celery_app
      beat
      --loglevel=info
      --pidfile=/tmp/celerybeat.pid

    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

volumes:
  redis_data:
  redis_broker_data:
  qdrant_data:
  temp_uploads:
