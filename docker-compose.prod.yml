# Production Docker Compose - Optimized for High-Performance Bulk Uploads
#
# Postgres is NOT managed here; it runs on AWS RDS.
# All environment variables (including POSTGRES_SERVER, credentials, secrets)
# are injected via .env.prod which the CI/CD deploy step writes from GitHub
# Actions secrets before running this file.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml up -d --scale celery-worker=8  # 8 workers

version: "3.9"

services:

  ##################################################
  # Redis
  ##################################################
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped

    ports:
      - "6386:6379"

    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ##################################################
  # Qdrant
  ##################################################
  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: qdrant
    restart: unless-stopped

    ports:
      - "6343:6333"
      - "6344:6334"

    volumes:
      - qdrant_data:/qdrant/storage

    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ##################################################
  # FastAPI
  ##################################################
  api:
    # image: 940031346406.dkr.ecr.us-west-1.amazonaws.com/justedtech-prod-be
    image: ${ECR_IMAGE}
    pull_policy: always
    container_name: just-edtech-api
    restart: unless-stopped

    env_file:
      - .env.prod

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QDRANT_URL: http://qdrant:6333

    ports:
      - "8013:8000"

    depends_on:
      redis:
        condition: service_healthy

      qdrant:
        condition: service_healthy

    volumes:
      - temp_uploads:/app/temp_uploads

    command: >
      sh -c "
      alembic upgrade head &&
      gunicorn app.main:app --config gunicorn.conf.py
      "

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8000/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G

  ##################################################
  # Celery Worker
  ##################################################
  celery-worker:
    image: ${ECR_IMAGE}
    pull_policy: always
    container_name: celery-worker
    restart: unless-stopped

    env_file:
      - .env.prod

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QDRANT_URL: http://qdrant:6333

    depends_on:
      redis:
        condition: service_healthy

      qdrant:
        condition: service_healthy

    volumes:
      - temp_uploads:/app/temp_uploads

    command: >
      celery
      -A app.celery_app
      worker
      --loglevel=info
      --concurrency=2
      --max-tasks-per-child=1000
      --time-limit=3600
      --soft-time-limit=3000
      -Q celery,documents

    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  ##################################################
  # Celery Scraper Worker
  # Dedicated to the `scraping` queue: Playwright, media downloads,
  # yt-dlp transcripts, Whisper transcription. Single-concurrency to keep
  # memory bounded; raise via replicas rather than --concurrency.
  ##################################################

  celery-scraper:
    image: ${ECR_IMAGE}
    pull_policy: always

    container_name: celery-scraper
    restart: unless-stopped

    env_file:
      - .env.prod

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QDRANT_URL: http://qdrant:6333

    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

    volumes:
      - temp_uploads:/app/temp_uploads

    command: >
      celery
      -A app.celery_app
      worker
      --loglevel=info
      --concurrency=1
      --max-tasks-per-child=100
      --time-limit=7200
      --soft-time-limit=6000
      -Q scraping

    healthcheck:
      test: ["CMD", "celery", "-A", "app.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2G

  ##################################################
  # Celery Beat - Periodic Task Scheduler
  # Fires the biweekly school scrape cycle + daily/monthly aggregations.
  # Scale horizontally only with a distributed beat scheduler (e.g. redbeat);
  # keep replicas=1 to avoid duplicate periodic task firing.
  ##################################################

  celery-beat:
    image: ${ECR_IMAGE}
    pull_policy: always

    container_name: celery-beat
    restart: unless-stopped

    env_file:
      - .env.prod

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QDRANT_URL: http://qdrant:6333

    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

    command: >
      celery
      -A app.celery_app
      beat
      --loglevel=info
      --pidfile=/tmp/celerybeat.pid

volumes:
  redis_data:
  qdrant_data:
  temp_uploads:
