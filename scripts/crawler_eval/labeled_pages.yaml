# Crawler eval harness — labeled pages.
#
# Top level: a YAML list. One row per page. Each row carries:
#   - Ground truth (has_data, has_data_links, data_type, is_archive,
#     data_years_available, expected_relevant_links) — what the LLM SHOULD
#     return.
#   - predicted: a verbatim snapshot of the POC's actual output for this page
#     (copied from scripts/school_data/output/schema_crawl_results.json). Used
#     by --offline mode (no LLM calls) and to compute per-page deltas in live
#     mode. Rows without a predicted: block are live-only (they were not in
#     the POC run).
#
# Target size: ~60 labeled pages. The first ~22 rows are seeded here from the
# 20-school POC run (predicted snapshots verbatim, ground truth set by
# inspecting the URL + stored markdown). The remaining rows are marked
# `# TODO: label` with the URL pre-filled — fill these in to reach the full
# eval set (~2-3 hours manual work, one-time).
#
# data_type values must be one of DATA_TYPES in
# scripts/school_data/schema_crawl_poc/schemas.py:
#   board_minutes, board_agenda, policy_document, book_challenge,
#   public_comment, candidate_profile, election_record, news_media,
#   advocacy_intervention, unknown
# Use null for data_type when has_data=false (no data_page_info).

# ── Section 1: positive data pages (has_data=true) ────────────────────────────

- id: quabbin_school_committee_landing
  school_name: Quabbin
  url: https://www.qrsd.org/our_district/school_committee
  # Section landing page; links to documents/minutes/policy. Both flags true.
  has_data: true
  has_data_links: true
  data_type: unknown
  is_archive: false
  data_years_available: []
  predicted:
    has_data: true
    has_data_links: true
    data_type: unknown
    is_archive: false
  expected_relevant_links:
    - url: https://www.qrsd.org/our_district/school_committee/school_committee_meeting_minutes/
      confidence: 0.9
    - url: https://www.qrsd.org/our_district/school_committee/q_r_s_d_policy_manual/
      confidence: 0.9
  notes: "Section landing page; has_data and has_data_links both true."

