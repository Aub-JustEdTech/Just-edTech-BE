    WHEREAS, the District has reviewed its current health curriculum and
    found that comprehensive sex education is currently offered in
    grades 7-12 over 12 instructional weeks; and WHEREAS, community
    feedback has indicated a desire to refocus on abstinence-based
    instruction and to increase parental notification; NOW THEREFORE BE
    IT RESOLVED that the Committee directs the Superintendent to reduce
    sex education instruction to no more than 6 weeks, to add an
    abstinence-focused unit, and to provide written parental
    notification at least 10 days before any unit addressing human
    sexuality, gender identity, or sexual orientation.
