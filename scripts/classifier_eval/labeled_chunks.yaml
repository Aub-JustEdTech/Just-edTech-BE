# Eval set for the heatmap chunk classifier.
#
# Each entry is a chunk with the *expected* classification. The runner calls
# gpt-4o-mini, parses the structured response, and computes per-label
# precision/recall/F1 against these expectations.
#
# Composition (100 chunks total):
#   - ~30 substantive single-topic chunks (one topic, no actions)
#   - ~25 multi-topic chunks (topics + action_types)
#   - ~20 action-type-only chunks (action present, topic implied)
#   - ~15 off_topic / boilerplate chunks (roll calls, adjournments, TOC)
#   - ~10 ambiguous / hard negatives (passing mention vs substantive)
#
# Labels use the values defined in scripts/classifier_eval/taxonomy.py.
# `topics`, `action_types`, `subtopics` are *sets*: the runner compares
# predicted vs expected as sets (no ordering). `off_topic` is a bool.

# ── Section 1: substantive single-topic chunks ──────────────────────────────

- id: sex_ed_comprehensive_1
