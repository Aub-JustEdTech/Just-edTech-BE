  meeting_date: "2025-03-14"
  chunk_text: |
    The School Committee voted 5-2 to adopt the revised health curriculum,
    which expands comprehensive sex education to include grades 7-12. The
    new modules cover consent, healthy relationships, and STI prevention.
    Implementation begins fall 2025 with teacher training scheduled for
    August.
